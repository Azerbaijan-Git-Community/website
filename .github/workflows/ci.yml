name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
  # Throwaway Postgres from the lhci job's service container; the Checks job uses in-memory PGlite.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
  NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
  NEXT_PUBLIC_BETTER_AUTH_IDENTIFY_URL: "https://kv.better-auth.com/projects/ci"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
  BETTER_AUTH_SECRET_V1: "abcdefghijklmnopqrstuvwxyz1234567890"
  BETTER_AUTH_SECRET_V2: "abcdefghijklmnopqrstuvwxyz1234567890"
  BETTER_AUTH_URL: "http://localhost:3000"
  # Do not replace the env vars below with secrets
  CRON_SECRET: "nice_try"
  GITHUB_CLIENT_ID: "nice_try"
  GITHUB_CLIENT_SECRET: "nice_try"
  GH_STATS_TOKEN: "nice_try"
  SHOWCASE_WEBHOOK_SECRET: "nice_try"
  OMICRON_ORIGIN: "https://omicron.example"
  OMICRON_CLIENT_ID: "nice_try"
  OMICRON_CLIENT_SECRET: "nice_try"
  UPSTASH_REDIS_REST_URL: nice_try
  UPSTASH_REDIS_REST_TOKEN: "nice_try"

jobs:
  quality:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - parallel:
          - name: Generate Prisma client
            run: pnpm prisma generate
          - name: Generate route types
            run: pnpm next typegen

      - name: Checks
        run: pnpm check

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - parallel:
          - name: Set up database
            run: pnpm prisma db push && pnpm prisma db execute --file prisma/seed.sql
          - name: Generate Prisma client
            run: pnpm prisma generate

      # `pnpm build` minus prisma generate (done above) and the QStash sync (no token in CI).
      - name: Build
        run: pnpm next build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

      - name: Start server
        id: server
        background: true
        run: pnpm start

      # Crawlers (Googlebot, Lighthouse…) get a blocking render instead of the prerendered shell, so check both.
      - name: Check pages render
        run: |
          bot="Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36 Chrome-Lighthouse"
          for page in / /blog /blog/yusifaliyevpro-nextjs-app-router-rendering-strategies-csr-ssr-ssg-isr-ppr /leaderboard /showcase /api-docs; do
            curl -fsS -o /dev/null --max-time 30 --retry 30 --retry-connrefused --retry-delay 1 "http://localhost:3000$page"
            curl -fsS -o /dev/null --max-time 30 -A "$bot" "http://localhost:3000$page"
            echo "ok $page"
          done

      - name: Stop server
        cancel: server

  lhci:
    name: Lighthouse ${{ matrix.page }}
    needs: build
    runs-on: ubuntu-latest
    # One runner per page: audits sharing a CPU would skew each other's performance scores.
    strategy:
      fail-fast: false
      matrix:
        page:
          [
            /,
            /blog,
            /blog/yusifaliyevpro-nextjs-app-router-rendering-strategies-csr-ssr-ssg-isr-ppr,
            /leaderboard,
            /showcase,
            /api-docs,
          ]
    permissions:
      contents: read
      pull-requests: write

    # Partially prerendered pages (e.g. /blog/[slug]) still read the database when served.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - parallel:
          - name: Install dependencies
            run: pnpm install --frozen-lockfile
          - name: Download build
            uses: actions/download-artifact@v8
            with:
              name: next-build
              path: .next

      - name: Set up database
        run: pnpm prisma db push && pnpm prisma db execute --file prisma/seed.sql

      - name: Run Lighthouse CI
        run: pnpx @lhci/cli@0.15.x autorun --collect.url="http://localhost:3000${{ matrix.page }}"

  lighthouse:
    name: Lighthouse
    needs: lhci
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check all pages passed
        run: test "${{ needs.lhci.result }}" = success
