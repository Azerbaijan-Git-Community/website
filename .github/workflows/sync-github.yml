name: Sync GitHub Stats

# Hourly sync is scheduled via Upstash QStash (scripts/qstash-schedules.ts). This is a manual fallback.
on:
  workflow_dispatch:

jobs:
  sync:
    name: Sync GitHub Stats
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sync GitHub Stats
        run: |
          curl -sS --fail-with-body -X POST "${{ secrets.APP_URL }}/api/webhooks/leaderboard" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
