name: Sync GitHub Stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync GitHub Stats
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sync GitHub Stats
        run: |
          response=$(curl -s -X POST "${{ secrets.APP_URL }}/api/webhooks/leaderboard" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Response: $response"
