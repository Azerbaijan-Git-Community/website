saveExact: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: "no-downgrade"
trustPolicyExcludePrune: true
trustPolicyExclude:
  - semver@6.3.1
allowBuilds:
  "@prisma/engines": true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.4"
  - "@better-auth/drizzle-adapter@1.7.4"
  - "@better-auth/kysely-adapter@1.7.4"
  - "@better-auth/memory-adapter@1.7.4"
  - "@better-auth/mongo-adapter@1.7.4"
  - "@better-auth/prisma-adapter@1.7.4"
  - "@better-auth/telemetry@1.7.4"
  - better-auth@1.7.4
  - "@heroui/react@3.2.5"
  - "@heroui/styles@3.2.5"
