saveExact: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: "no-downgrade"
trustPolicyExcludePrune: true
trustPolicyExclude:
  - semver@6.3.1
allowBuilds:
  "@prisma/engines": true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@better-auth/infra@0.4.11"
  - "@modelcontextprotocol/core@2.1.0"
  - "@modelcontextprotocol/server@2.1.0"
  - "@upstash/ratelimit@2.2.0"
  - framer-motion@13.4.4
  - motion-dom@13.4.4
  - motion@13.4.4
